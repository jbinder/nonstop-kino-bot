services:
  kino-bot:
    build: .
    container_name: nonstop-kino-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Vienna}
      DATA_DIR: /data
    volumes:
      # persistent cache: sqlite db (users, program, movies, cinemas, ratings, geocache) + images
      - ./data:/data
    # the container starts as root, fixes ownership of ./data and drops to an unprivileged user
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
